<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Instrument Sans';
  src: url('../../SetBenchmark_Figma_Import/html-prototype/fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 400 500;
  font-style: normal;
}
@font-face {
  font-family: 'Instrument Sans';
  src: url('../../SetBenchmark_Figma_Import/html-prototype/fonts/InstrumentSans-Bold.ttf') format('truetype');
  font-weight: 600 700 800;
  font-style: normal;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

body {
  background: transparent;
  padding: 40px;
  display: inline-block;
  font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.aifluency-card {
  width: 314px;
  background: #FFFFFF;
  border: 1px solid rgba(226, 232, 240, 0.95);
  border-top: 3px solid #6366F1;
  border-radius: 20px;
  padding: 24px 24px 20px;
  box-shadow:
    0 28px 64px -14px rgba(15, 23, 42, 0.18),
    0 10px 24px -6px rgba(15, 23, 42, 0.08),
    0 0 0 1px rgba(255, 255, 255, 1) inset;
}

.head-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.card-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #64748B;
}

.chip-ai {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #FAF5FF;
  border: 1px solid #E9D5FF;
  color: #7E22CE;
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 999px;
}

.stat-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 20px;
}

.stat-num {
  font-size: 40px;
  font-weight: 800;
  color: #0F172A;
  letter-spacing: -0.04em;
  line-height: 1;
}

.stat-sub {
  font-size: 11.5px;
  font-weight: 700;
  color: #6B21A8;
  background: #F3E8FF;
  border: 1px solid #E9D5FF;
  padding: 4px 10px;
  border-radius: 999px;
}

.checks-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-top: 1px solid #F1F5F9;
  padding-top: 16px;
  margin-bottom: 16px;
}

.check-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: #334155;
  font-weight: 500;
}

.check-icon-circle {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #DCFCE7;
  color: #15803D;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.reviewer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid #F1F5F9;
  padding-top: 14px;
  font-size: 12px;
  color: #475569;
}

.reviewer-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.reviewer-avatar {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FDE68A 0%, #F59E0B 100%);
  color: #78350F;
  font-size: 9.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.reviewer-name {
  color: #0F172A;
  font-weight: 600;
}

.rubric-tag {
  font-size: 11px;
  font-weight: 700;
  color: #166534;
  background: #ECFDF5;
  border: 1px solid #A7F3D0;
  padding: 2px 7px;
  border-radius: 6px;
}
</style>
</head>
<body>

<div class="aifluency-card">
  <div class="head-row">
    <span class="card-title">AI Fluency Review</span>
    <span class="chip-ai">✨ AI Allowed</span>
  </div>
  <div class="stat-row">
    <span class="stat-num">94%</span>
    <span class="stat-sub">Prompt Judgment</span>
  </div>
  <div class="checks-list">
    <div class="check-item">
      <div class="check-icon-circle">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <span>3 Prompts Directed &amp; Refined</span>
    </div>
    <div class="check-item">
      <div class="check-icon-circle">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <span>0 AI Hallucinations Accepted</span>
    </div>
    <div class="check-item">
      <div class="check-icon-circle">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <span>6/6 Unit Tests Verified</span>
    </div>
  </div>
  <div class="reviewer-row">
    <div class="reviewer-left">
      <div class="reviewer-avatar">MS</div>
      <span>Scored by <span class="reviewer-name">Meera S.</span></span>
    </div>
    <span class="rubric-tag">Rubric 18/20</span>
  </div>
</div>

</body>
</html>
