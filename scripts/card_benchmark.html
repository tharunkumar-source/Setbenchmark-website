<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Instrument Sans';
  src: url('../../SetBenchmark_Figma_Import/html-prototype/fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 400 500;
  font-style: normal;
}
@font-face {
  font-family: 'Instrument Sans';
  src: url('../../SetBenchmark_Figma_Import/html-prototype/fonts/InstrumentSans-Bold.ttf') format('truetype');
  font-weight: 600 700 800;
  font-style: normal;
}
@font-face {
  font-family: 'JetBrains Mono';
  src: url('../../SetBenchmark_Figma_Import/html-prototype/fonts/JetBrainsMono-Regular.ttf') format('truetype');
  font-weight: 500 600;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

body {
  background: transparent;
  padding: 40px;
  display: inline-block;
  font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.benchmark-card {
  width: 304px;
  background: #FFFFFF;
  border: 1px solid rgba(226, 232, 240, 0.95);
  border-radius: 20px;
  padding: 24px 24px 20px;
  box-shadow:
    0 28px 64px -14px rgba(15, 23, 42, 0.18),
    0 10px 24px -6px rgba(15, 23, 42, 0.08),
    0 0 0 1px rgba(255, 255, 255, 1) inset;
}

.head-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.card-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #64748B;
}

.meets-tag {
  font-size: 11.5px;
  font-weight: 600;
  color: #166534;
  background: #F0FDF4;
  border: 1px solid #BBF7D0;
  padding: 3px 9px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

.score-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 20px;
}

.score-left {
  display: flex;
  align-items: baseline;
  gap: 3px;
}

.score-value {
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: #0F172A;
  line-height: 1;
}

.score-denom {
  font-size: 14px;
  font-weight: 600;
  color: #94A3B8;
  margin-left: 2px;
}

.trend-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #F0FDF4;
  border: 1px solid #BBF7D0;
  color: #15803D;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 11px;
  border-radius: 999px;
}

/* 5-Bar Chart with subtle background tracks for a luxury dashboard feel */
.bars-track {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  height: 64px;
  padding: 4px 2px 2px;
  margin-bottom: 14px;
}

.bar-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
  height: 100%;
}

.bar-track-col {
  width: 100%;
  max-width: 22px;
  height: 100%;
  background: #F1F5F9;
  border-radius: 6px;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}

.bar-col {
  width: 100%;
  border-radius: 6px 6px 2px 2px;
  transition: height 0.3s ease;
}

.col-1 { height: 48%; background: #94A3B8; }
.col-2 { height: 82%; background: linear-gradient(180deg, #3B82F6 0%, #1D4ED8 100%); }
.col-3 { height: 38%; background: #CBD5E1; }
.col-4 { height: 94%; background: linear-gradient(180deg, #3B82F6 0%, #1D4ED8 100%); }
.col-5 { height: 68%; background: linear-gradient(180deg, #60A5FA 0%, #3B82F6 100%); }

.bar-lbl {
  font-size: 10.5px;
  font-weight: 600;
  color: #64748B;
  font-family: 'JetBrains Mono', monospace;
}

.card-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid #F1F5F9;
  padding-top: 14px;
  margin-top: 12px;
  font-size: 12px;
  font-weight: 500;
  color: #475569;
}

.foot-bold {
  font-weight: 700;
  color: #0F172A;
  background: #F1F5F9;
  border: 1px solid #E2E8F0;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;
}
</style>
</head>
<body>

<div class="benchmark-card">
  <div class="head-row">
    <span class="card-title">Candidate Benchmark</span>
    <span class="meets-tag">✓ Meets bar</span>
  </div>
  <div class="score-row">
    <div class="score-left">
      <span class="score-value">88</span>
      <span class="score-denom">/100</span>
    </div>
    <span class="trend-badge">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
      Top 5%
    </span>
  </div>
  <div class="bars-track">
    <div class="bar-item">
      <div class="bar-track-col">
        <div class="bar-col col-1"></div>
      </div>
      <span class="bar-lbl">Go</span>
    </div>
    <div class="bar-item">
      <div class="bar-track-col">
        <div class="bar-col col-2"></div>
      </div>
      <span class="bar-lbl">Async</span>
    </div>
    <div class="bar-item">
      <div class="bar-track-col">
        <div class="bar-col col-3"></div>
      </div>
      <span class="bar-lbl">DB</span>
    </div>
    <div class="bar-item">
      <div class="bar-track-col">
        <div class="bar-col col-4"></div>
      </div>
      <span class="bar-lbl">Arch</span>
    </div>
    <div class="bar-item">
      <div class="bar-track-col">
        <div class="bar-col col-5"></div>
      </div>
      <span class="bar-lbl">AI</span>
    </div>
  </div>
  <div class="card-foot">
    <span>Senior Backend · Go v3</span>
    <span class="foot-bold">P91</span>
  </div>
</div>

</body>
</html>
