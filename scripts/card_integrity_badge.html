<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: 'Instrument Sans';
  src: url('../../SetBenchmark_Figma_Import/html-prototype/fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 500 600;
  font-style: normal;
}
@font-face {
  font-family: 'Instrument Sans';
  src: url('../../SetBenchmark_Figma_Import/html-prototype/fonts/InstrumentSans-Bold.ttf') format('truetype');
  font-weight: 700;
  font-style: normal;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

body {
  background: transparent;
  padding: 30px;
  display: inline-block;
  font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.integrity-badge {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  background: #FFFFFF;
  border: 1px solid rgba(226, 232, 240, 0.95);
  padding: 10px 18px 10px 12px;
  border-radius: 999px;
  box-shadow:
    0 20px 44px -8px rgba(15, 23, 42, 0.16),
    0 4px 12px -2px rgba(15, 23, 42, 0.06),
    0 0 0 1px rgba(255, 255, 255, 0.9) inset;
  font-size: 13px;
  font-weight: 600;
  color: #0F172A;
  white-space: nowrap;
}

.icon-wrap {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #F0FDF4;
  border: 1px solid #BBF7D0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #15803D;
  flex-shrink: 0;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #16A34A;
  box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2);
}
</style>
</head>
<body>

<div class="integrity-badge">
  <div class="icon-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
  </div>
  <span>Human-Reviewed Integrity</span>
  <div class="live-dot"></div>
</div>

</body>
</html>
