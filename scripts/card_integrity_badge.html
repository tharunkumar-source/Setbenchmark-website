<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  --brand: #C8F25A;
  --brand-dark: var(--brand-dark);
  --brand-subtle: var(--brand-subtle);
  --brand-border: #9AD628;
  --brand-border-light: var(--brand-border-light);
}

@font-face {
  font-family: 'Instrument Sans';
  src: url('../../SetBenchmark_Figma_Import/html-prototype/fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 400 500;
  font-style: normal;
}
@font-face {
  font-family: 'Instrument Sans';
  src: url('../../SetBenchmark_Figma_Import/html-prototype/fonts/InstrumentSans-Bold.ttf') format('truetype');
  font-weight: 600 700;
  font-style: normal;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

body {
  background: transparent;
  padding: 30px;
  display: inline-block;
  font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.integrity-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #FFFFFF;
  border: 1px solid #E3E6EE;
  padding: 8px 16px 8px 12px;
  border-radius: 999px;
  box-shadow:
    0 16px 32px -8px rgba(15, 18, 34, 0.14),
    0 4px 10px -2px rgba(15, 18, 34, 0.05),
    0 0 0 1px rgba(255, 255, 255, 0.8) inset;
  font-size: 12.5px;
  font-weight: 600;
  color: #0F1222;
  white-space: nowrap;
}

.icon-wrap {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--brand-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--brand-dark);
  flex-shrink: 0;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--brand-dark);
  box-shadow: 0 0 0 2px rgba(56, 84, 0, 0.2);
}
</style>
</head>
<body>

<div class="integrity-badge">
  <div class="icon-wrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
  </div>
  <span>Human-Reviewed Integrity</span>
  <div class="live-dot"></div>
</div>

</body>
</html>
